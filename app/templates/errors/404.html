{% extends "base.html" %}

{% block title %}Página não encontrada - 404{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h2 class="mb-4">Oops! Página não encontrada</h2>
        <p class="text-muted mb-5">
            A página que você está procurando não existe ou foi movida para outro local.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg shadow-sm">
            <i class="bi bi-house-door me-2"></i>Voltar para o Início
        </a>
    </div>
</div>
{% endblock %}
